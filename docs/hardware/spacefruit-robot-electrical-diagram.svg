<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050" role="img" aria-labelledby="title desc">
<title id="title">SpaceFruit selected compact robot electrical architecture</title><desc id="desc">Overview of the 3S battery, separate regulated power rails, Raspberry Pi and RP2040 controllers, selected sensors, motor drivers, motors, cameras, arm servos, and hardwired stop.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#182a37}.title{font-size:32px;font-weight:bold}.sub{font-size:17px;fill:#405663}.h{font-size:22px;font-weight:bold}.b{font-size:16px}.sm{font-size:14px}.box{fill:#f8fbfa;stroke:#36505e;stroke-width:2}.blue{fill:#eaf4ff;stroke:#327ab3;stroke-width:2}.green{fill:#eff8e9;stroke:#658a46;stroke-width:2}.amber{fill:#fff2dc;stroke:#bd7b20;stroke-width:2}.red{fill:#fff0ef;stroke:#b95348;stroke-width:2}.purple{fill:#f4edff;stroke:#7557aa;stroke-width:2}.p{fill:none;stroke:#c3453b;stroke-width:4}.g{fill:none;stroke:#3d4549;stroke-width:3}.i{fill:none;stroke:#2386b7;stroke-width:3}.s{fill:none;stroke:#64944b;stroke-width:3;stroke-dasharray:8 6}.a{fill:none;stroke:#9a6dbe;stroke-width:3}</style></defs>
<rect width="1700" height="1050" fill="#fff"/><text x="45" y="52" class="title">SpaceFruit · selected electrical architecture</text><text x="47" y="82" class="sub">8 × 5 in compact prototype · 3.3 V sensor logic · see detailed wire diagram for pin-level connections</text>

<rect x="55" y="150" width="250" height="125" rx="14" class="amber"/><text x="78" y="188" class="h">3S battery</text><text x="78" y="220" class="b">9–12.6 V Li-ion</text><text x="78" y="247" class="sm">matched cells · ≥15 A BMS</text>
<rect x="365" y="165" width="190" height="95" rx="12" class="red"/><text x="388" y="205" class="h">Fuse +</text><text x="388" y="233" class="b">master E-stop</text>
<path d="M305 212 H365" class="p"/><path d="M555 212 H650 V335" class="p"/>
<text x="583" y="195" class="sm">protected DC bus</text>

<rect x="570" y="145" width="270" height="105" rx="12" class="amber"/><text x="592" y="182" class="h">6 V motor buck</text><text x="592" y="212" class="b">≥3 A, transient headroom</text><text x="592" y="237" class="sm">separately fused</text>
<rect x="895" y="145" width="270" height="105" rx="12" class="amber"/><text x="917" y="182" class="h">5 V servo buck</text><text x="917" y="212" class="b">5 A dedicated supply</text><text x="917" y="237" class="sm">PCA9685 V+ only</text>
<rect x="1220" y="145" width="365" height="105" rx="12" class="amber"/><text x="1242" y="182" class="h">Pi 5 UPS/regulator</text><text x="1242" y="212" class="b">DFRobot FIT0992 · 5.1 V / 5 A</text><text x="1242" y="237" class="sm">6–18 V input from protected bus</text>
<path d="M650 335 V250 M650 335 H1030 V250 M650 335 H1400 V250" class="p"/>

<rect x="80" y="405" width="330" height="175" rx="16" class="blue"/><text x="105" y="445" class="h">Raspberry Pi 5</text><text x="105" y="477" class="b">Wi-Fi · app/API · vision</text><text x="105" y="507" class="b">2 × CSI cameras</text><text x="105" y="542" class="sm">USB command link to RP2040</text>
<rect x="500" y="405" width="350" height="175" rx="16" class="blue"/><text x="525" y="445" class="h">YD-RP2040</text><text x="525" y="477" class="b">motion + encoder control</text><text x="525" y="507" class="b">3.3 V I²C / GPIO / safety</text><text x="525" y="542" class="sm">watchdog + stop input</text>
<path d="M1400 250 V330 H245 V405" class="p"/><text x="92" y="385" class="sm">5.1 V / 5 A</text>
<path d="M410 480 H500" class="i"/><text x="420" y="465" class="sm">USB data</text>

<rect x="80" y="650" width="340" height="170" rx="14" class="green"/><text x="105" y="690" class="h">3.3 V sensor breakouts</text><text x="105" y="722" class="b">BME280 · ambient temperature/humidity</text><text x="105" y="752" class="b">BNO085 · heading/tilt</text><text x="105" y="782" class="b">2 × VL53L1X · front/rear range</text><text x="105" y="808" class="sm">I²C · ToF XSHUT assigns unique addresses</text>
<rect x="500" y="650" width="350" height="170" rx="14" class="purple"/><text x="525" y="690" class="h">Drive control</text><text x="525" y="722" class="b">2 × Motoron M2T256 I²C drivers</text><text x="525" y="752" class="b">4 × 210:1 6 V encoder motors</text><text x="525" y="782" class="b">4 × 60 × 8 mm wheels</text><text x="525" y="808" class="sm">Motors: 0.67 A theoretical stall each</text>
<rect x="930" y="650" width="300" height="170" rx="14" class="blue"/><text x="955" y="690" class="h">I²C / PWM</text><text x="955" y="722" class="b">PCA9685 · VCC=3.3 V</text><text x="955" y="752" class="b">Four PWM arm joints</text><text x="955" y="782" class="b">V+=5 V servo rail</text><text x="955" y="808" class="sm">Never connect V+ to logic 3V3</text>
<rect x="1310" y="650" width="300" height="170" rx="14" class="purple"/><text x="1335" y="690" class="h">Arm + cameras</text><text x="1335" y="722" class="b">4 × SG92R micro servos</text><text x="1335" y="752" class="b">front Camera Module 3 Wide</text><text x="1335" y="782" class="b">arm Camera Module 3</text><text x="1335" y="808" class="sm">CSI cables: Pi 5 22-pin to 15-pin</text>
<path d="M675 580 V610 H250 V650 M675 610 V650 M675 610 H1080 V650" class="i"/>
<path d="M840 735 H930 M1230 735 H1310" class="a"/>
<path d="M705 250 V620 H675 V650" class="p"/><path d="M1030 250 V620 H1080 V650" class="p"/>
<path d="M410 535 H455 V365 H245 V405" class="s"/>
<path d="M500 545 H455 V870 H245 V820" class="s"/>

<rect x="80" y="890" width="1530" height="105" rx="14" class="red"/><text x="105" y="930" class="h">Hardware E-stop / common ground</text><text x="105" y="963" class="b">NC latching E-stop relay physically removes motor and servo power; Pi can stay powered to report stop. Share signal ground at a star point and keep actuator return currents off logic paths.</text>
</svg>
